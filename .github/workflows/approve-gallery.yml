name: Approve Gallery Submission

# Opens the pull request that lands a submission. Triggered by adding the
# `approved` label (or dispatched with an issue number); merging that pull
# request is what actually publishes the entry.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to approve
        required: true

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  approve:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ffprobe reads the attachments' dimensions, duration and format. It is
      # not present on the runner image by default, so it is installed here
      # rather than assumed.
      - name: Install ffprobe
        run: |
          if ! command -v ffprobe > /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1

      - name: Resolve issue number
        id: resolve
        run: echo "number=${{ github.event.inputs.issue_number || github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      - name: Fetch issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue view "${{ steps.resolve.outputs.number }}" --json number,url,body,author,title,labels > issue.json

      # Re-validated rather than trusting the earlier `gallery:valid` label:
      # the issue body may have been edited after that check ran, and this is
      # the step that decides what gets committed.
      - name: Validate and emit gallery files
        run: node scripts/validate-gallery.mjs issue.json --emit gallery > report.md 2>&1

      # A removal writes the directory to delete rather than emitting files,
      # so that the deletion and the validation can never disagree about
      # which entry is being taken down.
      - name: Apply removal
        id: removal
        run: |
          if [ -f gallery/removal.txt ]; then
            target="$(cat gallery/removal.txt)"
            rm -f gallery/removal.txt
            rm -rf "$target"
            # Drop the author directory too once it holds nothing else.
            rmdir "$(dirname "$target")" 2>/dev/null || true
            echo "removed=$target" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild catalog
        run: node scripts/build-catalog.mjs

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: gallery/issue-${{ steps.resolve.outputs.number }}
          title: >-
            ${{ steps.removal.outputs.removed && 'Remove' || 'Publish' }}
            gallery entry from #${{ steps.resolve.outputs.number }}
          body: |
            Applies the request in #${{ steps.resolve.outputs.number }}.

            ${{ steps.removal.outputs.removed
              && format('Removes `{0}`.', steps.removal.outputs.removed)
              || 'Validated against the media limits, with the script extracted from the recording.' }}

            Merging updates the simulator's gallery.
          commit-message: >-
            ${{ steps.removal.outputs.removed && 'Remove' || 'Publish' }}
            gallery entry from #${{ steps.resolve.outputs.number }}
          add-paths: |
            gallery
            catalog.json

      - name: Comment outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ steps.pr.outputs.pull-request-url }}" ]; then
            gh issue comment "${{ steps.resolve.outputs.number }}" \
              --body "Pull request opened: ${{ steps.pr.outputs.pull-request-url }}"
          else
            gh issue comment "${{ steps.resolve.outputs.number }}" --body-file report.md
          fi
