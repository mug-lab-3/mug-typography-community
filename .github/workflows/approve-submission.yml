name: Approve Sample Submission

# Opens the pull request that lands a submission. Triggered by adding the
# `approved` label (or dispatched with an issue number); merging that pull
# request is what actually publishes the sample.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to approve
        required: true

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  approve:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve issue number
        id: resolve
        run: echo "number=${{ github.event.inputs.issue_number || github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      - name: Fetch issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue view "${{ steps.resolve.outputs.number }}" --json number,url,body,author > issue.json

      # Re-validated rather than trusting the earlier `sample:valid` label:
      # the issue body may have been edited after that check ran, and this is
      # the step that decides what gets committed.
      - name: Validate and emit sample files
        run: node scripts/validate-submission.mjs issue.json --emit samples > report.md 2>&1

      - name: Rebuild catalog
        run: node scripts/build-catalog.mjs

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sample/issue-${{ steps.resolve.outputs.number }}
          title: "Add community sample from #${{ steps.resolve.outputs.number }}"
          body: |
            Adds the sample submitted in #${{ steps.resolve.outputs.number }}.

            Validated against the media limits and the embedded script was
            extracted from the recording. Merging publishes it to the
            simulator's sample browser.
          commit-message: "Add community sample from #${{ steps.resolve.outputs.number }}"
          add-paths: |
            samples
            catalog.json

      - name: Comment outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ steps.pr.outputs.pull-request-url }}" ]; then
            gh issue comment "${{ steps.resolve.outputs.number }}" \
              --body "Pull request opened: ${{ steps.pr.outputs.pull-request-url }}"
          else
            gh issue comment "${{ steps.resolve.outputs.number }}" --body-file report.md
          fi
