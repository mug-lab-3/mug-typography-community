name: Gallery submission
description: Request that your animation be added to the Mug Typography gallery.
title: "[Gallery] "
labels: ["gallery-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your animation!

        Record your animation in the simulator with **Record**, which embeds
        the Lua source inside the resulting `.webm`. Press the camera button
        above the preview to save the still for your card.

        Attach both files by dragging them into the fields below — do not
        paste the Lua source as text, it is read back out of the recording
        itself.

        If you need to replace a file after posting, **edit this issue** and
        replace it in the field. Files attached in a comment are not picked
        up.

  - type: input
    id: title
    attributes:
      label: Title
      description: Shown on the card in the gallery.
      placeholder: Neon Flicker
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A sentence or two on what the animation does.
    validations:
      required: true

  - type: textarea
    id: recording
    attributes:
      label: Recording
      description: |
        The simulator recording with the script embedded.
        Limits: WebM, up to 1280x720, up to 15 seconds, up to 8 MB.
      placeholder: Drag your .webm file here.
    validations:
      required: true

  - type: textarea
    id: thumbnail
    attributes:
      label: Thumbnail
      description: |
        The still shown on the card before playback.
        Limits: WebP, PNG or JPEG, up to 1280x720, up to 500 KB.
      placeholder: Drag your image file here.
    validations:
      required: true

  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: >
            I wrote this script, and I agree to it being distributed as part
            of this project under the repository's license.
          required: true
