name: Gallery — update an entry
description: Replace the recording, thumbnail or script of an entry you already published.
title: "[Gallery update] "
labels: ["gallery-submission", "gallery:update"]
body:
  - type: markdown
    attributes:
      value: |
        This replaces one of your existing entries in place — it keeps its
        place in the gallery rather than appearing a second time.

        Give the **same title** as the entry you are updating. That title is
        how the entry is found, so it has to match exactly; if you want to
        rename it instead, remove the old entry and add a new one.

        Attach a fresh recording and thumbnail below, both required even if
        only one of them changed.

  - type: input
    id: title
    attributes:
      label: Title
      description: The title of the entry you are updating, exactly as published.
      placeholder: Neon Flicker
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A sentence or two on what the animation does.
    validations:
      required: true

  - type: textarea
    id: recording
    attributes:
      label: Recording
      description: |
        The simulator recording with the script embedded.
        Limits: WebM, up to 1280x720, up to 15 seconds, up to 8 MB.
      placeholder: Drag your .webm file here.
    validations:
      required: true

  - type: textarea
    id: thumbnail
    attributes:
      label: Thumbnail
      description: |
        The still shown on the card before playback.
        Limits: WebP, PNG or JPEG, up to 1280x720, up to 500 KB.
      placeholder: Drag your image file here.
    validations:
      required: true

  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: >
            I wrote this script, and I agree to it being distributed as part
            of this project under the repository's license.
          required: true
